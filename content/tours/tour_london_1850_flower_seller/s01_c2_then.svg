<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(35,30%,28%)"/><stop offset="1" stop-color="hsl(35,40%,12%)"/></linearGradient></defs>
<rect width="100%" height="100%" fill="url(#g)"/>
<text x="60" y="576" font-size="54" font-weight="bold" fill="#fff" font-family="Helvetica, Arial, sans-serif">Then (edited from now)</text>
<text x="60" y="806" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">Re-imagine this exact viewpoint as it</text><text x="60" y="846" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">looked in 1850. Keep the camera position,</text><text x="60" y="886" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">the street width, the horizon line and</text><text x="60" y="926" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">the outline of any building that already</text><text x="60" y="966" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">stood in 1850 exactly where they are.</text><text x="60" y="1006" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">Replace everything modern with what stood</text><text x="60" y="1046" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">there in 1850: Ludgate Hill looking east</text><text x="60" y="1086" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">to St Paul's Cathedral in 1850: the same</text><text x="60" y="1126" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">street and cathedral, but the roadway is</text><text x="60" y="1166" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">granite setts with horse-drawn omnibuses</text><text x="60" y="1206" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">and carts, the shops have painted</text><text x="60" y="1246" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">signboards and bow windows, gas lamps on</text><text x="60" y="1286" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">brackets, men in top hats and women in</text><text x="60" y="1326" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">shawls and bonnets, no railway bridge, no</text>
<text x="60" y="1860" font-size="26" fill="#ccc" font-family="Helvetica, Arial, sans-serif">MOCK MEDIA (no model was called)</text>
</svg>