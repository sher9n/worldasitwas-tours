<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(25,30%,28%)"/><stop offset="1" stop-color="hsl(25,40%,12%)"/></linearGradient></defs>
<rect width="100%" height="100%" fill="url(#g)"/>
<text x="60" y="576" font-size="54" font-weight="bold" fill="#fff" font-family="Helvetica, Arial, sans-serif">Reconstruction</text>
<text x="60" y="806" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">Ludgate Hill, London, 1850, seen from the</text><text x="60" y="846" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">pavement halfway up the hill looking east</text><text x="60" y="886" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">to the west front and dome of St Paul's</text><text x="60" y="926" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">Cathedral filling the top of the street.</text><text x="60" y="966" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">A jam of horse-drawn omnibuses with</text><text x="60" y="1006" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">painted names, a brewer's dray, hackney</text><text x="60" y="1046" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">cabs and hand-carts; men in top hats and</text><text x="60" y="1086" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">caps, women in shawls and bonnets;</text><text x="60" y="1126" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">drapers' and booksellers' shops with</text><text x="60" y="1166" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">painted signboards and bow windows on</text><text x="60" y="1206" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">both sides; a boy with a broom at a muddy</text><text x="60" y="1246" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">crossing; wet granite setts; grey</text><text x="60" y="1286" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">overcast morning light with coal smoke</text><text x="60" y="1326" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">haze. Photographic realism as if a</text>
<text x="60" y="1860" font-size="26" fill="#ccc" font-family="Helvetica, Arial, sans-serif">MOCK MEDIA (no model was called)</text>
</svg>