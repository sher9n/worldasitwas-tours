<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(25,30%,28%)"/><stop offset="1" stop-color="hsl(25,40%,12%)"/></linearGradient></defs>
<rect width="100%" height="100%" fill="url(#g)"/>
<text x="60" y="324" font-size="54" font-weight="bold" fill="#fff" font-family="Helvetica, Arial, sans-serif">Reconstruction</text>
<text x="60" y="454" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">Photographic portrait, a London flower</text><text x="60" y="494" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">seller of 1850, thirty-one years old,</text><text x="60" y="534" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">thin lively face with quick dark eyes and</text><text x="60" y="574" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">wind-reddened cheeks, brown hair pulled</text><text x="60" y="614" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">back under a plain straw bonnet with a</text><text x="60" y="654" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">faded ribbon, a grey wool shawl crossed</text><text x="60" y="694" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">over a dark print dress, a shallow wicker</text><text x="60" y="734" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">basket of violets on her arm, standing by</text><text x="60" y="774" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">iron railings on a grey morning, soft</text><text x="60" y="814" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">overcast light, photographic, muted</text><text x="60" y="854" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">colour Photographic realism as if a</text><text x="60" y="894" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">large-format camera had been on the spot</text><text x="60" y="934" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">in 1850, natural overcast London light,</text><text x="60" y="974" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">wet cobbles, coal smoke haze,</text>
<text x="60" y="1020" font-size="26" fill="#ccc" font-family="Helvetica, Arial, sans-serif">MOCK MEDIA (no model was called)</text>
</svg>