<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
<defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(25,30%,28%)"/><stop offset="1" stop-color="hsl(25,40%,12%)"/></linearGradient></defs>
<rect width="100%" height="100%" fill="url(#g)"/>
<text x="60" y="576" font-size="54" font-weight="bold" fill="#fff" font-family="Helvetica, Arial, sans-serif">Reconstruction</text>
<text x="60" y="806" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">Close view on the roadway of Ludgate</text><text x="60" y="846" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">Hill, 1850: a green horse-drawn omnibus</text><text x="60" y="886" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">with passengers on the knifeboard roof</text><text x="60" y="926" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">and a conductor on the step shouting, a</text><text x="60" y="966" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">brewer's dray with chained barrels</text><text x="60" y="1006" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">alongside, a hackney cab behind,</text><text x="60" y="1046" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">pedestrians threading between the wheels,</text><text x="60" y="1086" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">wet granite setts, shop fronts with</text><text x="60" y="1126" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">painted lettering, the cathedral dome</text><text x="60" y="1166" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">hazy above the rooftops at the top of the</text><text x="60" y="1206" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">street, grey daylight. Photographic</text><text x="60" y="1246" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">realism as if a large-format camera had</text><text x="60" y="1286" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">been on the spot in 1850, natural</text><text x="60" y="1326" font-size="30" fill="#fff" font-family="Helvetica, Arial, sans-serif">overcast London light, wet cobbles, coal</text>
<text x="60" y="1860" font-size="26" fill="#ccc" font-family="Helvetica, Arial, sans-serif">MOCK MEDIA (no model was called)</text>
</svg>